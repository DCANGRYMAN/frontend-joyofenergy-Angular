<div class="background shadow-2 flex overflow-hidden">
  <app-side-bar></app-side-bar>

  <div class="bg-very-light-grey p3 flex-auto overflow-auto">

    <div class="flex justify-between items-center mb3">
      <h1 class="regular darkgray line-height-1 m0">Energy consumption</h1>
      <button (click)="theme.toggle()" class="theme-toggle circle border-none">
        @if (theme.isDark()) {
          <span>L</span>
        } @else {
          <span>D</span>
        }
      </button>
    </div>

    <section class="mb3 filters">
      @for (filter of filters; track filter.value) {
        <button
          (click)="setFilter(filter.value)"
          class="h5 inline-block shadow-2 pl2 pr2 pt1 pb1 roundedMore border-grey bold"
          [class.bg-blue]="activeFilter() === filter.value"
          [class.white]="activeFilter() === filter.value"
          [class.bg-white]="activeFilter() !== filter.value"
          [class.darkgray]="activeFilter() !== filter.value"
        >
          {{ filter.label }}
        </button>
      }
    </section>

    <section class="chartHeight mb4">
      <app-chart [chartData]="filteredData()"></app-chart>
    </section>

    <app-footer></app-footer>
  </div>
</div>
